name: ci

# The checks every change must pass. The release workflow runs them too,
# before it builds.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            # go fmt uses the gofmt of go.mod's toolchain; a gofmt on PATH
            # from another Go version can align comments differently.
            echo "::error::Not formatted, run go fmt ./...:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go tool mygo vet
      # The tests load libghostty-vt, which MyGo's terminal plugin downloads
      # from GitHub into <os.UserCacheDir()>/mygo/natives/<sha256>/, once
      # per process. Keep it between runs, keyed by go.sum (the MyGo
      # version decides the library), and fetch it with retries before the
      # tests, so that a 504 from GitHub doesn't fail them.
      - name: natives cache folder
        id: natives
        # os.UserCacheDir on Linux: $XDG_CACHE_HOME, else ~/.cache.
        run: echo "dir=${XDG_CACHE_HOME:-$HOME/.cache}/mygo/natives" >> "$GITHUB_OUTPUT"
      - name: restore native libraries
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.natives.outputs.dir }}
          key: mygo-natives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum') }}
      - name: fetch native libraries
        id: fetch
        run: go run ./tools/natives
      # Saved as soon as the download succeeds, so it is kept even when the
      # tests then fail; never after a failed one, which would keep an
      # empty folder under the key for good.
      - name: save native libraries
        if: always() && steps.fetch.outcome == 'success' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.natives.outputs.dir }}
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - run: go test -race ./...
